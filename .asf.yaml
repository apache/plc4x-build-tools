github:
  description: Apache plc4x Build Tools
  homepage: https://plc4x.apache.org/

  dependabot_alerts: true
  dependabot_updates: false

  labels:
    - java

  features:
    wiki: false
    issues: false
    projects: true

  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: false

  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        require_last_push_approval: false
        required_approving_review_count: 1
      required_linear_history: false
      required_signatures: true
      required_conversation_resolution: true

notifications:
  commits: commits@plc4x.apache.org
  issues: issues@plc4x.apache.org
  discussions: dev@plc4x.apache.org
  pullrequests_status: commits@plc4x.apache.org
  pullrequests_comment: commits@plc4x.apache.org
  pullrequests_bot_dependabot: commits@plc4x.apache.org
